{% extends "base.html" %}
{% block title %}Sign In | PriceWatcher{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="card auth-card stack-md">
    <div>
      <h1>Sign In</h1>
      <p class="muted mb-0">Enter the administrator password to access PriceWatcher.</p>
    </div>

    {% if error %}
    <p class="notice notice-bad mb-0" role="alert">{{ error }}</p>
    {% endif %}

    <form action="/login" method="POST" class="stack-md">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-group mb-0">
        <label for="current-password">Admin Password</label>
        <input
          type="password"
          id="current-password"
          name="password"
          autocomplete="current-password"
          required
          autofocus
        >
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
  </div>
</section>
{% endblock %}
