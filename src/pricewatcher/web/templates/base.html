<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script src="/static/theme.js"></script>
  <title>{% block title %}PriceWatcher{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">PW</span>
        <span>PriceWatcher</span>
      </a>

      <nav class="nav-bar" aria-label="Main navigation">
        {% if not hide_nav %}
        <a class="nav-link" href="/" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Deals</a>
        <a class="nav-link" href="/manage" {% if active_page == "manage" %}aria-current="page"{% endif %}>Manage</a>
        <a class="nav-link" href="/packs" {% if active_page == "packs" %}aria-current="page"{% endif %}>Packs</a>
        <a class="nav-link" href="/settings" {% if active_page == "settings" %}aria-current="page"{% endif %}>Admin</a>
        {% endif %}
        <button type="button" id="theme-toggle-btn" class="btn btn-sm btn-theme" aria-label="Switch color theme" title="Switch color theme" aria-pressed="false">
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        {% if not hide_nav and is_authenticated %}
        <form class="nav-logout-form" action="/logout" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="btn btn-sm nav-logout-btn">Sign Out</button>
        </form>
        {% endif %}
      </nav>
    </div>
  </header>

  <main id="main-content" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
