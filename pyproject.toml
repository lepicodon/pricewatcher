[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pricewatcher"
version = "0.1.0"
description = "24/7 multi-source price monitoring service with per-watch YAML config, WAHA/email alerts, and Light/Dark Web UI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.49.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
pricewatcher = "pricewatcher.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pricewatcher = [
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S", "SIM"]
ignore = [
    "E501",
    "S101",
    "S110",
    "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S310", "S314", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["pricewatcher"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
