name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on tag pushes matching v0.1, v1.0, etc.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  # This sets the image name to owner/repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
            requirements-playwright.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          pip install --no-deps -e .
          pip install -e ".[dev]" pip-audit

      - name: Check lockfile freshness
        run: |
          python -m pip check
          python - <<'EOF'
          from pathlib import Path
          import re
          import tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          LOCK_LINE_RE = re.compile(r"^([A-Za-z0-9][A-Za-z0-9._-]*)==([0-9A-Za-z.+!_-]+)$")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))

          def load_lock(path_str: str) -> dict[str, Version]:
              locked: dict[str, Version] = {}
              for lineno, raw in enumerate(
                  Path(path_str).read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  match = LOCK_LINE_RE.match(line)
                  if not match:
                      raise SystemExit(
                          f"{path_str}:{lineno}: unpinned or invalid lockfile entry {line!r}"
                      )
                  name = canonicalize_name(match.group(1))
                  if name in locked:
                      raise SystemExit(f"{path_str}:{lineno}: duplicate lockfile entry {name!r}")
                  locked[name] = Version(match.group(2))
              return locked

          def verify_group(reqs: list[str], locked: dict[str, Version], lock_name: str) -> None:
              for raw_req in reqs:
                  req = Requirement(raw_req)
                  name = canonicalize_name(req.name)
                  if name not in locked:
                      raise SystemExit(f"{lock_name}: missing dependency {req.name!r}")
                  ver = locked[name]
                  if not req.specifier.contains(ver):
                      raise SystemExit(
                          f"{lock_name}: {req.name}=={ver} does not satisfy {raw_req!r}"
                      )

          base_lock = load_lock("requirements.lock")
          pw_lock = load_lock("requirements-playwright.lock")
          verify_group(pyproject["project"]["dependencies"], base_lock, "requirements.lock")
          verify_group(
              pyproject["project"]["optional-dependencies"]["playwright"],
              pw_lock,
              "requirements-playwright.lock",
          )
          for shared in sorted(base_lock.keys() & pw_lock.keys()):
              if base_lock[shared] != pw_lock[shared]:
                  raise SystemExit(
                      f"Conflicting pins for {shared}: {base_lock[shared]} vs {pw_lock[shared]}"
                  )
          print(
              f"Lockfiles verified ({len(base_lock)} runtime, {len(pw_lock)} playwright pins)."
          )
          EOF

      - name: Run ruff lint check
        run: ruff check

      - name: Run ruff format check
        run: ruff format --check

      - name: Run mypy type check
        run: mypy src

      - name: Run security audit
        run: pip-audit -r requirements.lock

      - name: Run pytest suite
        run: pytest -v

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push packages to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up QEMU for multi-platform support (linux/amd64 + linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Log in to GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      # Build and push Docker image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
