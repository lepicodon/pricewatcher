  apple_hardware:
    label: "Apple Hardware & Authorized Resellers"
    description: "Apple Certified Refurbished, Expercom, DataVision, Abt, and Apple deal RSS."
    sources:
      - name: "Expercom Search ({query})"
        adapter: json_api
